<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Nouveau — The Thistle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#efe9d6;
  --cream-deep:#e7e0c8;
  --ink:#3c3a30;
  --blue:#5f82a4;
  --olive:#a8a578;
  --olive-deep:#8f8c5e;
  --bw:clamp(58px,15vw,96px); /* pattern border thickness */
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#4b4438,#2c281f);
  padding:clamp(12px,4vw,48px);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color:var(--ink);
}
.card{
  position:relative;
  width:min(460px,100%);
  aspect-ratio:432/604;
  min-height:560px;
  min-width:0; /* flex item: stop aspect-ratio+min-height transferring a min width wider than small phones */
  background:var(--cream);
  background-image:radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.4), rgba(120,110,80,.12) 95%);
  border-radius:12px;
  box-shadow:0 25px 60px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
  overflow:hidden;
}
.edge{position:absolute;pointer-events:none}
.edge svg{display:block;width:100%;height:100%}
.edge-top{top:0;left:0;right:0;height:var(--bw)}
.edge-bottom{bottom:0;left:0;right:0;height:var(--bw);transform:scaleY(-1)}
.edge-left{top:var(--bw);bottom:var(--bw);left:0;width:var(--bw)}
.edge-right{top:var(--bw);bottom:var(--bw);right:0;width:var(--bw);transform:scaleX(-1)}
.content{
  position:absolute;
  inset:calc(var(--bw) + 2px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:.3em;
  padding:2% 4%;
  z-index:2;
}
.intro{
  font-style:italic;
  font-size:clamp(.72rem,3vw,.86rem);
  line-height:1.55;
}
.name{
  font-variant:small-caps;
  font-size:clamp(1.15rem,5vw,1.5rem);
  letter-spacing:.14em;
  font-weight:500;
  margin-top:.5em;
}
.name:last-of-type{margin-top:0}
.amp{
  font-size:clamp(.8rem,3.4vw,.95rem);
  letter-spacing:.2em;
  margin:.1em 0;
}
.when{
  font-style:italic;
  font-size:clamp(.74rem,3.1vw,.9rem);
  line-height:1.55;
  margin-top:1.1em;
}
.time{
  font-style:italic;
  font-size:clamp(.74rem,3.1vw,.9rem);
  margin-top:.8em;
}
.venue{
  font-variant:small-caps;
  font-size:clamp(.82rem,3.5vw,1rem);
  letter-spacing:.16em;
  font-weight:600;
  margin-top:1.1em;
}
.place{
  font-style:italic;
  font-size:clamp(.74rem,3.1vw,.9rem);
}
.script{
  font-family:"Monsieur La Doulaise","Snell Roundhand","Apple Chancery",cursive;
  font-size:clamp(1.35rem,5.6vw,1.7rem);
  margin-top:.9em;
  color:#4a4638;
  transform:rotate(-2deg);
}
@media (max-width:380px){
  :root{--bw:clamp(44px,13vw,58px)}
}
</style>
</head>
<body>
<main class="card" aria-label="Wedding invitation">

  <!-- shared thistle motif -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="thistle">
        <!-- sweeping blue side fronds: fill tile edges so adjacent tiles connect -->
        <path d="M0 108 C 12 72 10 40 0 12 C 30 34 38 68 26 108 Z" fill="#5f82a4"/>
        <path d="M108 108 C 96 72 98 40 108 12 C 78 34 70 68 82 108 Z" fill="#5f82a4"/>
        <!-- olive curls filling top corners -->
        <path d="M0 0 C 20 4 33 15 39 32 C 21 28 8 17 0 3 Z" fill="#a8a578"/>
        <path d="M108 0 C 88 4 75 15 69 32 C 87 28 100 17 108 3 Z" fill="#a8a578"/>
        <!-- olive acanthus fan from bottom centre -->
        <path d="M54 108 C 28 96 15 76 17 50 C 39 62 52 82 54 104 Z" fill="#a8a578"/>
        <path d="M54 108 C 80 96 93 76 91 50 C 69 62 56 82 54 104 Z" fill="#8f8c5e"/>
        <!-- central stem -->
        <path d="M54 104 C 48 78 48 58 54 40" stroke="#8f8c5e" stroke-width="3" fill="none"/>
        <!-- small blue leaves flanking the stem -->
        <path d="M46 72 C 36 66 31 57 32 46 C 41 52 46 61 46 72 Z" fill="#5f82a4"/>
        <path d="M62 72 C 72 66 77 57 76 46 C 67 52 62 61 62 72 Z" fill="#5f82a4"/>
        <!-- thistle globe -->
        <ellipse cx="54" cy="29" rx="15" ry="13" fill="#5f82a4"/>
        <g stroke="#efe9d6" stroke-width="1.2" fill="none">
          <path d="M43 24 q11 6 22 0"/>
          <path d="M42 30 q12 6 24 0"/>
          <path d="M45 36 q9 5 18 0"/>
        </g>
        <!-- spiky crown -->
        <path d="M41 21 L 34 6 L 46 14 L 50 0 L 54 12 L 58 0 L 62 14 L 74 6 L 67 21 Z" fill="#5f82a4"/>
      </g>
      <!-- one horizontal run of motifs, tile = 108px -->
      <g id="run">
        <use href="#thistle"/>
        <use href="#thistle" transform="translate(108,0)"/>
        <use href="#thistle" transform="translate(216,0)"/>
        <use href="#thistle" transform="translate(324,0)"/>
        <use href="#thistle" transform="translate(432,0)"/>
        <use href="#thistle" transform="translate(540,0)"/>
        <use href="#thistle" transform="translate(648,0)"/>
        <use href="#thistle" transform="translate(756,0)"/>
      </g>
    </defs>
  </svg>

  <div class="edge edge-top" aria-hidden="true">
    <svg viewBox="0 0 864 108" preserveAspectRatio="xMidYMid slice"><use href="#run"/></svg>
  </div>
  <div class="edge edge-bottom" aria-hidden="true">
    <svg viewBox="0 0 864 108" preserveAspectRatio="xMidYMid slice"><use href="#run"/></svg>
  </div>
  <div class="edge edge-left" aria-hidden="true">
    <svg viewBox="0 0 108 864" preserveAspectRatio="xMidYMid slice"><g transform="rotate(90 54 54)"><use href="#run" transform="translate(0,0)"/></g></svg>
  </div>
  <div class="edge edge-right" aria-hidden="true">
    <svg viewBox="0 0 108 864" preserveAspectRatio="xMidYMid slice"><g transform="rotate(90 54 54)"><use href="#run" transform="translate(0,0)"/></g></svg>
  </div>

  <section class="content">
    <p class="intro">Together with their parents<br>you are cordially invited to<br>celebrate the marriage of</p>
    <h1 class="name">Lorem Ipsum</h1>
    <p class="amp">&ndash;&nbsp;&amp;&nbsp;&ndash;</p>
    <h1 class="name">Dolor Amet</h1>
    <p class="when">Saturday, the fifth of December<br>Two thousand twenty-six</p>
    <p class="time">five o&rsquo;clock</p>
    <p class="venue">Consectetur House</p>
    <p class="place">Adipiscing, Elitshire</p>
    <p class="script">Merriment to follow</p>
  </section>
</main>
</body>
</html>
