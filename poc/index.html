<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP</title>
  <style>
    body { font-family: sans-serif; max-width: 26rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    input, button { font-size: 16px; }
    input[type="text"], input[type="number"] { width: 100%; padding: .4rem; box-sizing: border-box; }
    fieldset { margin-top: 1rem; }
    button { margin-top: 1.25rem; padding: .5rem 1.5rem; }
    #status { margin-top: 1rem; min-height: 1.5em; }
    #status.error { color: #b00020; }
  </style>
</head>
<body>
  <h1>RSVP</h1>
  <form id="rsvp-form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <fieldset>
      <legend>Attending</legend>
      <label><input type="radio" name="attending" value="yes" required> Yes</label>
      <label><input type="radio" name="attending" value="no"> No</label>
    </fieldset>

    <label for="guests">Guests</label>
    <input type="number" id="guests" name="guests" min="1" max="6" value="1">

    <button type="submit">Send RSVP</button>
    <div id="status"></div>
  </form>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
