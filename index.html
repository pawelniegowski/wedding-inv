<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaproszenie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
:root{
  --paper:#f5f0df;
  --ink:#463722;
  --line:#5d4a30;
  --gold:#b5762a;
  --gold-dark:#8f5a1d;
  --rust:#7a4a26;
  --margin:clamp(10px,1.8vw,22px);
  --rule:1.2px;
  --wash:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.5), rgba(93,74,48,.07) 90%);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background-color:var(--paper);
  background-image:var(--wash);
  color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  line-height:1.6;
  overflow-x:hidden;
  /* the paper margin the sheet's rule sits inside; padding rather than a
     margin on .sheet so it can't collapse through the body */
  padding:var(--margin);
}
/* The stationery sheet: a ruled border around the whole page, scrolling with
   it. The content lives inside the border, so nothing can slide out past it —
   which is why there is no viewport mask here. */
.sheet{
  position:relative;
  border:var(--rule) solid #4f3d27;
  min-height:calc(100vh - 2 * var(--margin));
}
.sheet::after{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(93,74,48,.4);
  pointer-events:none;
}
/* Branches ride above both rules and all page content, spilling over the edge.
   z-index:2 clears .sheet::after (the inner hairline) and the sections, which
   are position:relative at z-auto. */
svg.branch{
  position:absolute;
  pointer-events:none;
  z-index:2;
  width:clamp(120px,26vw,380px);
  height:auto;
}
/* Flush with the screen on every side: the sheet's padding box is already
   inset by the margin plus its own rule, so pull back by exactly that. The
   artwork runs past its own viewBox (the stem starts at x=232 of 230), so
   there is no transparent gutter to leave a seam. */
.branch.tr{
  top:calc(-1 * (var(--margin) + var(--rule)));
  right:calc(-1 * (var(--margin) + var(--rule)));
}
.branch.bl{
  bottom:calc(-1 * (var(--margin) + var(--rule)));
  left:calc(-1 * (var(--margin) + var(--rule)));
  transform:rotate(180deg);
}

main{position:relative}
section{
  position:relative;
  max-width:660px;
  margin:0 auto;
  padding:clamp(1.2rem,2.5vh,2rem) clamp(1.6rem,6vw,2rem);
  text-align:center;
}
.hero{
  max-width:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.35em;
  padding:clamp(4rem,10vh,6rem) 1.6rem clamp(1rem,2vh,1.4rem);
}
.eyebrow{
  font-size:clamp(.8rem,1.9vw,1.05rem);
  letter-spacing:.34em;
  text-indent:.34em;
  text-transform:uppercase;
  line-height:2.1;
  font-weight:500;
}
.names{
  font-family:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  font-size:clamp(2.4rem,7vw,4.4rem);
  font-weight:400;
  line-height:1.2;
  color:#3f321f;
}
.amp{
  font-family:"Pinyon Script",cursive;
  font-size:clamp(1.4rem,3.4vw,2.1rem);
  line-height:1;
  margin:.0em 0;
  padding-bottom: 0.5em;
}
.amp::before{content:"– ";font-family:"Cormorant Garamond",serif;font-size:.7em;vertical-align:.2em}
.amp::after{content:" –";font-family:"Cormorant Garamond",serif;font-size:.7em;vertical-align:.2em}
.people{
  font-family:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  font-size:clamp(1.8rem,5vw,3.1rem);
  font-weight:400;
  line-height:1.25;
  color:#3f321f;
  margin:.1em 0;
}
.day{
  /*margin-top:1.6em;*/
  font-size:clamp(1.05rem,2.4vw,1.45rem);
  letter-spacing:.3em;
  text-indent:.3em;
  text-transform:uppercase;
  font-weight:500;
}
.sprig{width:clamp(90px,12vw,150px);margin:.8em auto;color:var(--gold);display:block}
.month{font-family:"Pinyon Script",cursive;font-size:clamp(1.9rem,4.2vw,2.7rem)}
.daynum{
  font-size:clamp(1.45rem,3.1vw,2rem);
  letter-spacing:.12em;
  display:flex;align-items:center;justify-content:center;gap:.55em;
}
.daynum::before,.daynum::after{content:"··";color:var(--gold);font-size:.7em;letter-spacing:.15em}
.year{font-size:clamp(1.55rem,3.3vw,2.1rem);letter-spacing:.18em;text-indent:.18em}
.city{
  font-size:clamp(.78rem,1.8vw,1rem);
  letter-spacing:.34em;text-indent:.34em;
  text-transform:uppercase;margin-top:.6em;font-weight:500;
}
.city a{
  color:inherit;
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:border-color .2s,color .2s;
}
.city a:hover,.city a:focus-visible{color:var(--gold-dark);border-bottom-color:var(--gold)}
.pin{
  width:.95em;
  height:auto;
  color:var(--gold);
  vertical-align:-.16em;
  margin-left:.15em;
}
.nowrap{white-space:nowrap}
/* visible to screen readers only */
.sr-only{
  position:absolute;width:1px;height:1px;
  margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;
}
h2{
  font-size:clamp(1rem,2.4vw,1.3rem);
  letter-spacing:.4em;
  text-indent:.4em;
  text-transform:uppercase;
  font-weight:600;
}
.lead{
  font-style:italic;
  font-size:clamp(1.15rem,2.3vw,1.35rem);
  /*margin-top:1.2em;*/
}
form{
  margin-top:2.2em;
  display:flex;
  flex-direction:column;
  gap:1.6em;
  text-align:left;
}
label{
  display:block;
  font-size:.85rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  font-weight:600;
  margin-bottom:.5em;
  color:var(--gold-dark);
}
input[type=text],input[type=number]{
  width:100%;
  background:transparent;
  border:0;
  border-bottom:1px solid var(--line);
  font-family:inherit;
  font-size:1.2rem;
  color:var(--ink);
  padding:.35em .1em;
  border-radius:0;
}
input[type=text]:focus,input[type=number]:focus{outline:none;border-bottom-color:var(--gold)}
input[type=number]{max-width:7em}
fieldset{border:0}
legend{
  display:block;
  font-size:.85rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  font-weight:600;
  margin-bottom:.5em;
  color:var(--gold-dark);
}
.choices{display:flex;gap:2em;flex-wrap:wrap}
.choices label{display:flex;align-items:center;gap:.6em;margin:0;cursor:pointer;font-weight:500;
  font-size:1.05rem;letter-spacing:.04em;text-transform:none;color:var(--ink)}
.people-list{flex-direction:column;gap:.7em;align-items:stretch}
.person-row{
  display:flex;justify-content:space-between;align-items:center;gap:1em;
  font-size:1.05rem;letter-spacing:.04em;
}
.person-row .pchoice{display:flex;gap:1.4em}
.person-row.missing .pname{color:#8a2214}
.extra{margin-top:1.2em}
input[type=radio],input[type=checkbox]{accent-color:var(--gold-dark);width:1em;height:1em}
#people-fieldset:disabled{opacity:.45}
button{
  align-self:center;
  font-family:inherit;
  font-size:.95rem;
  letter-spacing:.34em;
  text-indent:.34em;
  text-transform:uppercase;
  color:var(--paper);
  background:var(--gold-dark);
  border:1px solid var(--gold-dark);
  padding:.9em 2.6em;
  cursor:pointer;
  transition:background .2s,color .2s;
}
button:hover{background:transparent;color:var(--gold-dark)}
button:disabled{opacity:.55;cursor:default}
button:disabled:hover{background:var(--gold-dark);color:var(--paper)}
#status{
  min-height:1.6em;
  text-align:center;
  font-style:italic;
  font-size:1.05rem;
}
#status.error{color:#8a2214;font-style:normal}
.confirm{
  margin-top:2.2em;
  font-size:1.15rem;
  line-height:1.9;
}
.confirm strong{
  display:block;
  font-family:"Pinyon Script",cursive;
  font-weight:400;
  font-size:1.9rem;
  color:#3f321f;
}
footer{
  position:relative;
  text-align:center;
  padding:clamp(4rem,12vh,7rem) 1.6rem clamp(5rem,14vh,8rem);
  font-size:.85rem;
  letter-spacing:.3em;
  text-transform:uppercase;
}
  </style>
</head>
<body>

<!-- shared defs: leaf + leafy frond + full corner branch -->

      <path d="M82 13 C90 8 98 8 106 13 C98 18 90 18 82 13Z" fill="currentColor"/>

    </g>
  </defs>
</svg>

<div class="sheet">
<svg class="branch tr" viewBox="0 0 230 230" aria-hidden="true"><use href="#branchart"/></svg>
<svg class="branch bl" viewBox="0 0 230 230" aria-hidden="true"><use href="#branchart"/></svg>

<main>
  <section class="hero">
    <h1 class="names">Sofiia Serdiuk</h1>
    <p class="amp">oraz</p>
    <h1 class="names">Paweł Niegowski</h1>
    <p class="eyebrow">mają przyjemność zaprosić</p>
    <!-- replaced from the decoded invite; a real name here would leak into the repo -->
    <p class="people">Szanownych Gości</p>
    <p class="eyebrow">na obiad weselny</p>
    <svg class="sprig" viewBox="0 0 120 26" aria-hidden="true"><use href="#sprigart"/></svg>
    <p class="city"><a href="https://maps.app.goo.gl/c3KKdzaPyXcYRtjc9" target="_blank" rel="noopener">w
      Restauracji Gdańskiej<br>ul. Świętego Ducha <span class="nowrap">16/24<svg class="pin"
      viewBox="0 0 24 32" aria-hidden="true"><use href="#pinart"/></svg></span><span class="sr-only">
      — otwórz w Mapach Google</span></a></p>
    <p class="day">piątek, 11 września 2026</p>
    <p class="day">16:00</p>
    <svg class="sprig" viewBox="0 0 120 26" aria-hidden="true"><use href="#sprigart"/></svg>
    <p class="lead">Prosimy o potwierdzenie przybycia do 20 sierpnia</p>

    <form id="rsvp-form">
      <fieldset id="people-fieldset">
        <div class="choices people-list" id="people-list"></div>
        <div class="extra">
          <input type="text" id="extra" name="extra" autocomplete="off" placeholder="oraz... (imię i nazwisko)">
        </div>
      </fieldset>
      <button type="submit">Wyślij odpowiedź</button>
      <div id="status" role="status"></div>
    </form>
  </section>
</main>

<!-- kept as a spacer: the branch it used to hold now hangs off the sheet
     corner, but the form still needs room above the bottom rule -->
<footer></footer>
</div>

<script src="config.js"></script>
<script src="guests.js"></script>
<script src="app.js"></script>
</body>
</html>
